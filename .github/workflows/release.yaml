name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
      attestations: write
      artifact-metadata: write # attestation storage records
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # `latest` is deliberately not published. A mutable tag is not a
          # deployable reference; pin a version or a digest.
          flavor: latest=false

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Publish chart
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      # Publish the packaged chart and index to the gh-pages branch, which
      # GitHub Pages serves and a Flux HelmRepository of type `default`
      # consumes. This is a plain git push rather than chart-releaser: in this
      # org the workflow token, despite being granted contents:write, gets
      # "403 Resource not accessible by integration" from the releases API,
      # and hosting the .tgz on Pages needs no releases at all.
      - name: Publish chart to gh-pages
        run: |
          set -euo pipefail
          helm package charts/cert-manager-webhook-porkbun -d /tmp/pages-drop
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp /tmp/pages-drop/*.tgz /tmp/pages/
          # Landing page, Artifact Hub repository metadata, the Google Search
          # Console verification file, robots.txt, CNAME and .nojekyll. These have
          # to sit next to index.yaml: Artifact Hub only looks for
          # artifacthub-repo.yml at the repository URL's own path, Search Console
          # only looks for google*.html at the verified property's own path, and
          # CNAME is what keeps Pages on the custom domain. `cp -a src/.` rather
          # than `src/*` so the dotfiles come along.
          cp -a "${GITHUB_WORKSPACE}/pages/." /tmp/pages/
          helm repo index /tmp/pages --url https://porkbun.octabits.io
          cd /tmp/pages
          git add -A
          # Idempotent re-runs: an already-published version changes nothing.
          if git diff --cached --quiet; then
            echo "chart already published, nothing to do"
          else
            git commit -m "Publish chart for ${GITHUB_REF_NAME}"
            git push origin HEAD:gh-pages
          fi

      # Also publish as an OCI artifact, for HelmRepository type: oci.
      - name: Push chart to GHCR
        run: |
          helm registry login ghcr.io \
            -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/cert-manager-webhook-porkbun -d dist/
          helm push dist/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # Last, so a failure here cannot leave the image or the Helm repository
    # half-published. Historically nothing created these releases at all —
    # v2.0.0 and v2.0.1 were cut by hand and v2.0.2 through v2.0.4 were simply
    # missing. If this step ever 403s the way chart-releaser did (see the
    # comment in the chart job), the artifacts are already live and the release
    # can be made by hand:
    #   gh release create vX.Y.Z --title vX.Y.Z --notes-file notes.md dist/*.tgz
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Package the chart
        run: helm package charts/cert-manager-webhook-porkbun -d dist/

      # The CHANGELOG section for this version, verbatim. It is the release
      # note that already exists; generating one from commit subjects instead
      # would be strictly worse and would drift from Artifact Hub's notes.
      - name: Extract release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v ver="## ${VERSION#v}" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## ${VERSION#v}' section" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "- Image: \`ghcr.io/${{ github.repository }}:${VERSION#v}\` (linux/amd64+arm64, cosign-signed, SBOM + provenance)"
            echo "  digest \`${{ needs.image.outputs.digest }}\`"
            echo "- Helm repo: \`https://porkbun.octabits.io\`"
            echo "- OCI chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/cert-manager-webhook-porkbun\`"
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent, so a re-run of a partially failed release converges
          # rather than erroring on an existing release.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md --title "$VERSION"
            gh release upload "$VERSION" dist/*.tgz --clobber
          else
            gh release create "$VERSION" --verify-tag \
              --title "$VERSION" --notes-file notes.md dist/*.tgz
          fi
