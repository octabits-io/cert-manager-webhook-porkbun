name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
      attestations: write
      artifact-metadata: write # attestation storage records
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # `latest` is deliberately not published. A mutable tag is not a
          # deployable reference; pin a version or a digest.
          flavor: latest=false

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Publish chart
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      # Publish the packaged chart and index to the gh-pages branch, which
      # GitHub Pages serves and a Flux HelmRepository of type `default`
      # consumes. This is a plain git push rather than chart-releaser: in this
      # org the workflow token, despite being granted contents:write, gets
      # "403 Resource not accessible by integration" from the releases API,
      # and hosting the .tgz on Pages needs no releases at all.
      - name: Publish chart to gh-pages
        run: |
          set -euo pipefail
          helm package charts/cert-manager-webhook-porkbun -d /tmp/pages-drop
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp /tmp/pages-drop/*.tgz /tmp/pages/
          helm repo index /tmp/pages --url https://octabits-io.github.io/cert-manager-webhook-porkbun
          cd /tmp/pages
          git add -A
          # Idempotent re-runs: an already-published version changes nothing.
          if git diff --cached --quiet; then
            echo "chart already published, nothing to do"
          else
            git commit -m "Publish chart for ${GITHUB_REF_NAME}"
            git push origin HEAD:gh-pages
          fi

      # Also publish as an OCI artifact, for HelmRepository type: oci.
      - name: Push chart to GHCR
        run: |
          helm registry login ghcr.io \
            -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/cert-manager-webhook-porkbun -d dist/
          helm push dist/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
