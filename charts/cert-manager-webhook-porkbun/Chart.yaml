apiVersion: v2
name: cert-manager-webhook-porkbun
description: cert-manager ACME DNS-01 solver webhook for domains hosted at Porkbun, for Let's Encrypt wildcard certificates
type: application

# Chart version. Bumped independently of appVersion.
version: 2.0.6

# Version of the webhook image this chart deploys by default.
appVersion: "2.0.6"

home: https://github.com/octabits-io/cert-manager-webhook-porkbun
sources:
  - https://github.com/octabits-io/cert-manager-webhook-porkbun

# Served from gh-pages rather than raw.githubusercontent.com, which returns SVG
# as text/plain and so renders as nothing. Published by the same release that
# publishes this chart, so the two never disagree.
icon: https://porkbun.octabits.io/favicon.svg

maintainers:
  - name: Daniel Hartmann
    email: contact@dk2.de
    url: https://github.com/octabits-io

# Terms people actually search for, not just the ones that describe the code.
# Artifact Hub weights these, and `helm search hub` queries them directly.
keywords:
  - cert-manager
  - cert-manager-webhook
  - acme
  - dns01
  - dns-01
  - porkbun
  - letsencrypt
  - lets-encrypt
  - wildcard-certificate
  - tls
  - certificates
  - webhook
  - solver

annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/operator: "false"
  artifacthub.io/images: |
    - name: cert-manager-webhook-porkbun
      image: ghcr.io/octabits-io/cert-manager-webhook-porkbun:2.0.6
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: source
      url: https://github.com/octabits-io/cert-manager-webhook-porkbun
    - name: support
      url: https://github.com/octabits-io/cert-manager-webhook-porkbun/issues
    - name: changelog
      url: https://github.com/octabits-io/cert-manager-webhook-porkbun/blob/main/CHANGELOG.md
    - name: container image
      url: https://github.com/octabits-io/cert-manager-webhook-porkbun/pkgs/container/cert-manager-webhook-porkbun
  # Rendered as the release notes on Artifact Hub, for the chart version above
  # and no other. Update it with every version bump, alongside CHANGELOG.md and
  # containsSecurityUpdates, or it silently describes the wrong release — and
  # keep unreleased work out of it until the bump lands.
  artifacthub.io/changes: |
    - kind: security
      description: gRPC-Go bumped to 1.83.2, clearing CVE-2026-84304 (HIGH, remote heap exhaustion via fragmented HTTP/2 DATA frames)
    - kind: security
      description: golang.org/x/crypto bumped to 0.56.0, clearing CVE-2026-56855 and CVE-2026-78662 in x/crypto/ssh
