apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-webhook-porkbun.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-manager-webhook-porkbun.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      # The container listens on an unprivileged port; the Service keeps
      # exposing 443, which is what the APIService connects to.
      targetPort: https
      protocol: TCP
  selector:
    {{- include "cert-manager-webhook-porkbun.selectorLabels" . | nindent 4 }}
