{{/*
Derived from cert-manager/webhook-example (Apache-2.0, Copyright The
cert-manager Authors) by way of Talinx/cert-manager-webhook-porkbun.
Modified by Octabits — see NOTICE and CHANGELOG.md.
*/}}
{{- $fullName := include "cert-manager-webhook-porkbun.fullname" . -}}
{{- $sa := include "cert-manager-webhook-porkbun.serviceAccountName" . -}}
{{- $labels := include "cert-manager-webhook-porkbun.labels" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
{{- end }}
# Read the ConfigMap holding the apiserver's requestheader CA, so incoming
# aggregated requests can be authenticated.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Delegate authentication and authorization decisions back to the core
# apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}:auth-delegator
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# An aggregated apiserver reads the cluster's API Priority and Fairness
# configuration at startup. Without this it starts anyway but logs a steady
# stream of authorization errors, which buries real failures.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}:flowcontrol
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups:
      - flowcontrol.apiserver.k8s.io
    resources:
      - prioritylevelconfigurations
      - flowschemas
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}:flowcontrol
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}:flowcontrol
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Allow cert-manager to create ChallengePayload resources in our API group,
# which is how it hands challenges to this webhook.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}:domain-solver
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}:domain-solver
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}

{{/*
Read access to the Secrets holding Porkbun API credentials.

The solver only ever performs a single `get` by name, so `list` and `watch` are
never granted: with them, a compromised webhook could enumerate and read every
Secret it can reach. Namespaced Roles are the default for the same reason.
*/}}
{{- $access := .Values.rbac.secretAccess }}
{{- $rule := dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "get") }}
{{- if $access.secretNames }}
{{- $_ := set $rule "resourceNames" $access.secretNames }}
{{- end }}
{{- if eq $access.scope "Cluster" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}:secret-reader
  labels:
    {{- $labels | nindent 4 }}
rules:
  - {{ toYaml $rule | nindent 4 | trim }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}:secret-reader
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- $namespaces := prepend ($access.namespaces | default list) .Release.Namespace | uniq }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}:secret-reader
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - {{ toYaml $rule | nindent 4 | trim }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}:secret-reader
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
