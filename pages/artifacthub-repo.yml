# Artifact Hub repository metadata.
#
# This file is published to the root of the gh-pages branch by
# .github/workflows/release.yaml, so that it is served next to index.yaml —
# Artifact Hub only looks for it at the repository URL's path.
#
# `repositoryID` is what earns the "Verified Publisher" badge: it ties this
# published file to the repository registered at
# https://artifacthub.io/control-panel/repositories. It is an identifier, not a
# secret. Artifact Hub applies it the next time it processes the repository,
# and for Helm repositories it only reprocesses when index.yaml changes — so
# the badge appears after the next release, not on push.
#
# `owners` lets an Artifact Hub account claim ownership; the email has to match
# the one on that account. Ownership claims are processed immediately.

repositoryID: 5725560d-e381-4c96-85e6-1e4675bb7985

owners:
  - name: Daniel Hartmann
    email: contact@dk2.de
