<!doctype html>
<!--
  https://porkbun.octabits.io/ — the Helm repository's address, and nothing
  else to read here any more.

  The project's page moved to https://octabits.io/open-source/porkbun, which
  renders this repository's README at each release tag, so there is one text
  to maintain instead of two. This page only sends a browser there. GitHub
  Pages cannot answer with a 301, so the redirect is a meta refresh, with a
  script ahead of it that carries the #fragment along (the README's sections
  have the same anchors there), and a canonical link that tells a search
  engine where the page lives now.

  `helm repo add` never reads this file — it fetches index.yaml, which the
  release workflow publishes beside it, together with artifacthub-repo.yml and
  the chart archives. Those are what this host is for.

  Published by .github/workflows/release.yaml. No external request.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cert-manager-webhook-porkbun has moved</title>
    <link rel="canonical" href="https://octabits.io/open-source/porkbun" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      location.replace('https://octabits.io/open-source/porkbun' + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://octabits.io/open-source/porkbun" />
    <style>
      body {
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        max-width: 36rem;
        margin: 15vh auto;
        padding: 0 16px;
        color: #13201a;
        background: #faf7ef;
      }
      a {
        color: #17744a;
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <p>
      The documentation for cert-manager-webhook-porkbun is at
      <a href="https://octabits.io/open-source/porkbun">octabits.io/open-source/porkbun</a>.
    </p>
    <p>
      This address is the Helm repository:
      <code>helm repo add octabits https://porkbun.octabits.io</code>
    </p>
  </body>
</html>
