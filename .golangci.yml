version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars

  settings:
    gosec:
      excludes:
        # G404 (weak RNG): the only use of math/rand here is retry jitter,
        # which has no security requirement.
        - G404
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
